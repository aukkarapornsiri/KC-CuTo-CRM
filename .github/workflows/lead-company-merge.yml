name: Lead Company Merge Rules
on:
  pull_request:
    paths:
      - 'src/lead-duplicates.mjs'
      - 'src/lead-field-settings.mjs'
      - 'tests/lead-policy-settings-smoke.mjs'
      - 'src/internal-workspace.mjs'
      - 'tests/lead-duplicates-smoke.mjs'
      - '.github/workflows/lead-company-merge.yml'
jobs:
  lead-company-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Verify shared contacts and owner-based merge actions
        run: |
          mkdir -p test-artifacts
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/lead-merge-http.log 2>&1 &
          sleep 2
          node tests/lead-duplicates-smoke.mjs
          node tests/lead-policy-settings-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lead-company-merge
          path: test-artifacts/
