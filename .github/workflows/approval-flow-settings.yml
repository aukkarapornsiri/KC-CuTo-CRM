name: Approval Flow Settings Review
on:
  pull_request:
    paths:
      - 'src/approval-flow-settings.mjs'
      - 'src/access-management.mjs'
      - 'src/settings-workspace.mjs'
      - 'tests/approval-flow-settings-smoke.mjs'
      - '.github/workflows/approval-flow-settings.yml'
jobs:
  approval-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Verify approval configuration and eligibility
        run: |
          mkdir -p test-artifacts
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/flow-http.log 2>&1 &
          sleep 2
          SITE_URL='http://127.0.0.1:4173/?demo=1' node tests/approval-flow-settings-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approval-flow-settings
          path: test-artifacts/
