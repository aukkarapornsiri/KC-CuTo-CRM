name: Quotation Follow-up Fluid Layout
on:
  pull_request:
    paths:
      - 'src/quotation-followup.css'
      - 'tests/quotation-followup-smoke.mjs'
      - '.github/workflows/quotation-followup-layout.yml'
jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright && npx playwright install chromium
      - run: |
          mkdir -p test-artifacts
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/qf-http.log 2>&1 &
          sleep 2
          node tests/quotation-followup-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quotation-followup-fluid
          path: test-artifacts/
