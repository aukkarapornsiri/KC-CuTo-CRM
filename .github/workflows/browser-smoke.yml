name: KC KuTo Browser Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kc-kuto-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: quotation-contact
            suites: quotation-contact-smoke
          - group: native-sales-orders
            suites: native-sales-orders-smoke
          - group: regression
            suites: internal-workspace-smoke opportunity-dialog-smoke settings-workspace-smoke
          - group: customer-sales
            suites: login-layout-smoke quick-create-smoke customer360-smoke customer360-create-smoke header-ai-chat-smoke quotation-layout-smoke quotation-details-smoke quotation-print-smoke
          - group: navigation-settings
            suites: sales-targets-smoke sales-attainment-ring-smoke dashboard-layout-smoke navigation-smoke smoke settings-cards-smoke settings-smoke master-data-smoke
          - group: operations
            suites: workspace-theme-smoke executive-smoke marketing-map-smoke service-desk-smoke inventory-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Install PDF text verification
        if: matrix.group == 'customer-sales'
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Start static development site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . > /tmp/kuto-http.log 2>&1 &
          echo $! > /tmp/kuto-http.pid
          sleep 2
      - name: Run desktop and mobile smoke tests
        env:
          SMOKE_SUITES: ${{ matrix.suites }}
        run: |
          mkdir -p test-artifacts
          task_status=0
          for suite in $SMOKE_SUITES; do
            # Default login is tested without demo; existing demo suites opt in explicitly.
            SITE_URL='http://127.0.0.1:4173/?demo=1' node tests/$suite.mjs > test-artifacts/$suite.log 2>&1 || task_status=1
            cat test-artifacts/$suite.log
          done
          exit "$task_status"
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kc-kuto-smoke-${{ matrix.group }}
          path: test-artifacts/
          if-no-files-found: ignore
