name: SO Filter Cards
on:
  pull_request:
    paths: ['src/sales-orders.mjs', 'tests/so-filter-cards-smoke.mjs', '.github/workflows/so-filter-cards.yml']
jobs:
  filters:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright && npx playwright install chromium
      - run: |
          mkdir -p test-artifacts
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/so-filters.log 2>&1 &
          sleep 2
          node tests/so-filter-cards-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: so-filter-cards
          path: test-artifacts/
