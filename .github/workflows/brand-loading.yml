name: Brand startup loading
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: python -m http.server 4178 > /tmp/site.log 2>&1 &
      - run: node tests/brand-loading-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brand-loading
          path: test-artifacts/
