name: Quotation Party Layout Review
on:
  pull_request:
    paths:
      - 'src/quotation-document.css'
      - 'tests/quotation-party-layout-smoke.mjs'
      - '.github/workflows/quotation-party-layout.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: python -m http.server 4178 > /tmp/site.log 2>&1 &
      - run: node tests/quotation-party-layout-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quotation-party-layout
          path: test-artifacts/
