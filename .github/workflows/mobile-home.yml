name: Mobile icon home
on:
  pull_request:
    paths:
      - 'src/mobile-home.*'
      - 'assets/mobile-home/**'
      - 'app-C2ITSffc.js'
      - 'index.html'
      - 'tests/mobile-home-smoke.mjs'
      - '.github/workflows/mobile-home.yml'
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/mobile-notification-navigation.test.mjs tests/notification-center.test.mjs
      - run: npm install --no-save playwright && npx playwright install chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/http.log 2>&1 &
          sleep 2
          node tests/mobile-home-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-icon-home
          path: test-artifacts/
