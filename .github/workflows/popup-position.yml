name: Centered Popup Review
on:
  pull_request:
    paths:
      - 'src/popup-position.css'
      - 'src/popup-close.css'
      - 'src/close-cross.svg'
      - 'tests/popup-position-smoke.mjs'
      - '.github/workflows/popup-position.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: python -m http.server 4178 > /tmp/site.log 2>&1 &
      - run: node tests/popup-position-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: centered-popups
          path: test-artifacts/
