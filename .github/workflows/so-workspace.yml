name: SO Workspace Browser Check
on:
  pull_request:
    paths:
      - 'src/sales-order*'
      - 'src/customer360*'
      - 'tests/customer360-journey*'
      - 'tests/sales-order-redesign-smoke.mjs'
      - '.github/workflows/so-workspace.yml'
  workflow_dispatch:
jobs:
  so-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm init -y && npm install --save-dev playwright && npx playwright install --with-deps chromium
      - run: |
          mkdir -p test-artifacts
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/so-http.log 2>&1 &
          sleep 2
          node tests/sales-order-redesign-smoke.mjs
          node tests/customer360-journey-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: so-workspace-screenshots
          path: test-artifacts/
