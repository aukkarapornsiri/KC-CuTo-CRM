name: Explicit No PO Sales Orders
on:
  pull_request:
    paths:
      - 'src/sales-order*'
      - 'src/so-amendments.mjs'
      - 'tests/sales-order-no-po*'
      - 'supabase/migrations/*sales_order_explicit_no_po.sql'
      - '.github/workflows/so-no-po.yml'
jobs:
  no-po:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright @electric-sql/pglite && npx playwright install chromium
      - run: node --test tests/sales-order-no-po.test.mjs tests/native-sales-orders.test.mjs tests/so-amendments.test.mjs tests/sales-order-excel.test.mjs
      - run: |
          mkdir -p test-artifacts
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/so-no-po-http.log 2>&1 &
          sleep 2
          node tests/sales-order-no-po-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: so-no-po
          path: test-artifacts/
