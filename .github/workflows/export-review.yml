name: Export Review
on:
  pull_request:
    paths:
      - 'src/sales-order-excel.mjs'
      - 'src/quotation-print.mjs'
      - 'src/sales-order-print.mjs'
      - 'tests/export-review-smoke.mjs'
      - 'tests/so-review-fit-smoke.mjs'
      - 'tests/cost-sheet-direct-print-smoke.mjs'
      - '.github/workflows/export-review.yml'
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright && npx playwright install chromium
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: node --test tests/sales-order-excel.test.mjs
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 &
          sleep 2
          node tests/export-review-smoke.mjs
          node tests/so-review-fit-smoke.mjs
          node tests/cost-sheet-direct-print-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: export-review
          path: test-artifacts/
