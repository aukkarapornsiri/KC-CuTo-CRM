name: Validate KC KuTo Bundle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          if ! node --check app-C2ITSffc.js 2> /tmp/js-check.err; then
            npm install --no-save acorn >/dev/null 2>&1
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import * as acorn from 'acorn';
          const src = fs.readFileSync('app-C2ITSffc.js','utf8');
          try {
            acorn.parse(src,{ecmaVersion:'latest',sourceType:'module'});
          } catch (e) {
            console.log('ACORN_ERROR', JSON.stringify({message:e.message,pos:e.pos,loc:e.loc}));
            const p = e.pos || 0;
            console.log('CONTEXT', src.slice(Math.max(0,p-400),p+400));
          }
          NODE
            exit 1
          fi
      - name: Verify required site assets
        run: |
          test -f index.html
          test -f app-Dou2_7PY.css
          test -f app-C2ITSffc.js
          grep -q "app-C2ITSffc.js" index.html
      - name: Validate integration contracts
        run: node tests/integration-contract.mjs
      - name: Validate shared notification polling
        run: node --test tests/notification-store.test.mjs tests/read-coordinator.test.mjs tests/rest-read-policy.test.mjs
      - name: Validate settings source and input boundaries
        run: |
          node --check src/customer360.mjs
          node --test tests/customer360.test.mjs tests/customer360-followup.test.mjs tests/customer360-readiness.test.mjs tests/customer360-finance.test.mjs
          node --check src/inventory.mjs
          node --test tests/role-access.test.mjs tests/permission-matrix-exhaustive.test.mjs tests/delete-user.test.mjs tests/experience-access.test.mjs tests/inventory-permission-controls.test.mjs tests/user-status-actions.test.mjs
          node --test tests/inventory-model.test.mjs tests/inventory-api.test.cjs
          node --check src/service-desk.mjs
          node --test tests/service-model.test.mjs
          node --check src/email-studio.mjs
          node --test tests/email-studio.test.mjs
          node --check src/marketing-email.mjs
          node --check src/sales-map.mjs
          node --test tests/ai-edge.test.cjs tests/ai-providers.test.mjs
          node --test tests/microsoft-calendar.test.mjs tests/microsoft-mail.test.mjs
          node --test tests/marketing-model.test.mjs tests/sales-map-model.test.mjs tests/sales-order-sync-model.test.mjs tests/sales-order-sync-edge.test.mjs
          npm install --no-save --no-package-lock sanitize-html@2.17.0
          node --test tests/marketing-edge.test.mjs
          node --check src/internal-workspace.mjs
          node --check src/lead-detail-enterprise.mjs
          node --test tests/lead-detail-enterprise.test.mjs
          node --test tests/thai-address.test.mjs tests/bilingual-address.test.mjs
          node --check src/quotation-document.mjs
          node --check src/number-format.mjs
          node --test tests/number-format.test.mjs
          node --check src/sales-targets.mjs
          node --test tests/sales-targets.test.mjs
          node --check src/internal-reports.mjs
          node --test tests/internal-model.test.mjs
          node --check src/opportunity-dialog.mjs
          node --test tests/opportunity-form.test.mjs
          node --test tests/quotation-workflow.test.mjs tests/quotation-recurring.test.mjs tests/sales-order-cost-sheet.test.mjs tests/native-sales-orders.test.mjs tests/sales-order-excel.test.mjs
          node --test tests/quotation-template.test.mjs tests/quotation-designer.test.mjs tests/quotation-customer-picker.test.mjs tests/quotation-persistence.test.mjs tests/quotation-company.test.mjs
          node --test tests/account360-connector.test.mjs
          node --check src/experience.mjs
          node --test tests/experience.test.mjs
          node --test tests/experience-access.test.mjs
          node --check src/master-data.mjs
          node --test tests/master-data.test.mjs
          node --check src/settings-workspace.mjs
          node --test tests/settings-model.test.mjs tests/delete-user.test.mjs tests/profile-names.test.mjs tests/role-access.test.mjs tests/grouped-navigation.test.mjs tests/user-si-defaults.test.mjs
          node --check src/workspace-theme.mjs
          node --test tests/workspace-theme.test.mjs
      - name: Test assignment email summaries in isolated Postgres
        run: |
          npm install --no-save --no-package-lock @electric-sql/pglite@0.3.14
          node --test tests/assignment-email-summary.test.mjs
      - name: Parse Edge Function TypeScript
        run: |
          npx -y esbuild supabase/functions/crm-user-admin/index.ts --bundle --platform=neutral --format=esm --external:npm:* --outfile=/tmp/crm-user-admin.js
          npx -y esbuild supabase/functions/server/index.ts --bundle --platform=neutral --format=esm --external:npm:* --outfile=/tmp/kuto-server.js
          npx -y esbuild supabase/functions/stripe-webhook/index.ts --bundle --platform=neutral --format=esm --external:npm:* --outfile=/tmp/stripe-webhook.js

          npx -y esbuild supabase/functions/marketing-email/index.ts --bundle --platform=neutral --format=esm --external:npm:* --outfile=/tmp/marketing-email.js
          npx -y esbuild supabase/functions/kc-dw-sales-sync/index.ts --bundle --platform=neutral --format=esm --external:npm:* --outfile=/tmp/kc-dw-sales-sync.js
  role-access-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Check real role access and atomic saves
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create role authenticated; create role anon;'
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/role-access-fixture.sql -f supabase/migrations/20261002100115_effective_role_access.sql -f tests/role-access-db.sql

      - name: Check sales target allocation, atomic saves and scoped reads
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/sales-target-fixture.sql -f supabase/migrations/20261002102807_sales_target_planning.sql -f tests/sales-targets-db.sql
