name: Activity Save Close Review
on:
  pull_request:
    paths:
      - 'src/internal-workspace.mjs'
      - 'src/activity-calendar-dialog.mjs'
      - 'tests/activity-calendar-browser.cjs'
      - 'tests/activity-details-smoke.mjs'
      - '.github/workflows/activity-save-close.yml'
jobs:
  activity-save-close:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Verify successful save closes and saved activity can reopen
        run: |
          mkdir -p test-artifacts
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/activity-save-http.log 2>&1 &
          sleep 2
          node tests/activity-calendar-browser.cjs
          node tests/activity-details-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activity-save-close
          path: test-artifacts/
